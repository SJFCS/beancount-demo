# 青簿记账页面配置。此文件属于账本，应用启动和同步后都以此处内容为准。
version: 1

types:
  - id: expense
    label: 支出
    icon: minus-circle
    kind: expense
  - id: income
    label: 收入
    icon: plus-circle
    kind: income
  - id: transfer
    label: 转账
    icon: repeat
    kind: transfer
  # - id: invest
  #   label: 理财
  #   icon: trending-up
  #   kind: transfer

defaults:
  expense:
    payment: Assets:Digital:AliPay
    category: Expenses:Food:快餐外卖
  income:
    payment: Assets:Digital:AliPay
    category: Income:Salary
  transfer:
    from: Assets:Digital:AliPay
    to: Assets:Digital:WeChatPay
  invest:
    from: Assets:Digital:AliPay
    to: Assets:Investment:FutuHKCash

accounts:
  Assets:
    - id: DebitCard
      label: 借记卡
      icon: credit-card
      color: "#4B94C6"
      children:
        - id: CMB-1333
          label: 招商借记卡
          icon: credit-card
    - id: Digital
      label: 电子支付
      icon: smartphone
      color: "#5C9A86"
      children:
        - id: AliPay
          label: 支付宝
          icon: wallet
        - id: WeChatPay
          label: 微信钱包
          icon: message-circle
    - id: Investment
      label: 投资账户
      icon: trending-up
      color: "#8B7BB8"
      children:
        - id: FutuHKCash
          label: 富途现金
          icon: briefcase
        - id: Fund
          label: 基金
          icon: pie-chart
          children:
            - id: FUND005827
              label: 易方达蓝筹

  Liabilities:
    - id: ConsumptionCredit
      label: 消费信贷
      icon: shopping-bag
      color: "#C28174"
      children:
        - id: 花呗
          label: 花呗
        - id: 白条
          label: 白条
        - id: 抖音月付
          label: 抖音月付
